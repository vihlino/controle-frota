  // Modal de "segunda senha" pra confirmar edição/exclusão de um checklist já enviado
  // (aba "Gerenciar checklists"). Pede a senha do usuário logado antes de chamar o servidor.
  function renderConfirmModal(){
    var type = state.confirmAction.type;
    var isDelete = type === "delete-entry";
    var isDeleteUser = type === "delete-user";
    var title = isDeleteUser ? 'Remover usuário' : (isDelete ? 'Apagar checklist' : 'Salvar Alterações');
    var message = isDeleteUser
      ? 'Essa ação remove o acesso desse usuário ao painel e não pode ser desfeita. Confirme sua senha (do usuário logado agora) pra continuar.'
      : (isDelete
        ? 'Essa ação apaga o checklist da planilha e não pode ser desfeita. Confirme sua senha do painel pra continuar.'
        : 'Confirme sua senha do painel pra salvar as alterações neste checklist.');
    var okLabel = state.confirmBusy ? 'Confirmando…' : (isDeleteUser ? 'Remover' : (isDelete ? 'Apagar' : 'Confirmar'));
    return '<div class="modal-bg" id="confirm-modal-bg"><div class="modal-card">'+
      '<h3>'+title+'</h3>'+
      '<p>'+message+'</p>'+
      '<div class="field"><input type="password" id="cf-password" placeholder="Sua senha" value="'+escapeHtml(state.confirmPassword)+'"></div>'+
      (state.confirmError ? '<div class="error-text" style="margin-top:-8px;margin-bottom:12px;">'+escapeHtml(state.confirmError)+'</div>' : '')+
      '<div class="modal-actions">'+
        '<button class="btn btn-outline btn-small" id="cf-cancel">Cancelar</button>'+
        '<button class="btn btn-primary btn-small" id="cf-ok" '+(state.confirmBusy?'disabled':'')+'>'+okLabel+'</button>'+
      '</div>'+
    '</div></div>';
  }

  // ==================== EVENTS (liga os elementos da tela às funções acima) ====================
  // Cada attachXEvents() é chamado logo depois de renderX() injetar o HTML novo.
  // Como innerHTML substitui os elementos, os "escutadores" de clique/digitação
  // precisam ser reconectados toda vez — por isso essas funções são chamadas de
  // novo a cada render(), em vez de configuradas apenas uma vez.
  // Liga todos os campos do checklist (veículo, condutor, datas, odômetro,
  // equipamentos, foto) e o botão de enviar.
  function attachFormEvents(){
    var $ = function(id){ return document.getElementById(id); };
    if($("f-vehicle")) $("f-vehicle").onchange = function(ev){
      form.vehicleId = ev.target.value;
      form.kmOut = ""; // veículo trocado: o km sugerido do veículo anterior não vale mais
      saveDraft();
      applyLastKmSuggestion(form.vehicleId);
    };
    if($("f-condutor")) $("f-condutor").onchange = function(ev){
      var dr = state.drivers.find(function(x){ return x.id === ev.target.value; });
      form.condutor = dr ? dr.name : "";
      form.condutorId = dr ? dr.id : "";
      // O campo Matrícula sempre começa vazio ao trocar de condutor - se ele tiver
      // matrícula cadastrada, precisa digitar de cabeça pra confirmar (no lugar do antigo
      // PIN); sem cadastro, fica livre pra digitar sem confirmação nenhuma.
      form.matricula = "";
      saveDraft();
      render();
    };
    if($("f-matricula")) $("f-matricula").oninput = function(ev){
      form.matricula = ev.target.value.replace(/\D/g,"").slice(0,15);
      ev.target.value = form.matricula;
      saveDraft();
    };
    if($("f-date")) $("f-date").onchange = function(ev){ form.date = ev.target.value; saveDraft(); };
    if($("f-percurso")) $("f-percurso").oninput = function(ev){
      form.percurso = ev.target.value.toUpperCase();
      ev.target.value = form.percurso;
      saveDraft();
    };
    if($("f-horasaida")) $("f-horasaida").onchange = function(ev){ form.horaSaida = ev.target.value; saveDraft(); render(); };
    if($("f-horachegada")) $("f-horachegada").onchange = function(ev){ form.horaChegada = ev.target.value; saveDraft(); render(); };
    if($("f-kmout")) $("f-kmout").oninput = function(ev){ form.kmOut = ev.target.value; saveDraft(); render(); focusAfter("f-kmout"); };
    if($("f-kmin")) $("f-kmin").oninput = function(ev){ form.kmIn = ev.target.value; saveDraft(); render(); focusAfter("f-kmin"); };
    document.querySelectorAll("[data-equip]").forEach(function(group){
      var key = group.getAttribute("data-equip");
      group.querySelectorAll("button").forEach(function(btn){
        btn.onclick = function(){ form[key] = btn.getAttribute("data-val"); saveDraft(); render(); };
      });
    });
    if($("f-photo-input")) $("f-photo-input").onchange = async function(ev){
      var file = ev.target.files[0];
      if(!file) return;
      state.photoData = await resizeImage(file);
      saveDraft();
      render();
    };
    if($("f-photo-remove")) $("f-photo-remove").onclick = function(){ state.photoData = null; saveDraft(); render(); };
    if($("f-submit")) $("f-submit").onclick = submitForm;
    if($("f-admin-link")) $("f-admin-link").onclick = function(ev){
      ev.preventDefault();
      state.mode = "login";
      render();
    };
  }

  // Truque para forçar o teclado numérico do celular a "atualizar" depois que o
  // valor do campo é alterado por código (não pelo toque do usuário).
  function focusAfter(id){
    var el = document.getElementById(id);
    if(el){ el.focus(); var v = el.value; el.value=""; el.value=v; }
  }

  // Liga o botão "Registrar outro checklist" da tela de sucesso.
  function attachSuccessEvents(){
    var el = document.getElementById("s-new");
    if(el) el.onclick = resetForm;
  }

  // Liga tudo que existe no painel do gestor: troca de aba, filtros, formulários
  // de cadastro (veículo/motorista/usuário) e botões de remover, organizados por aba.
  function attachAdminEvents(){
    var $ = function(id){ return document.getElementById(id); };

    document.querySelectorAll("[data-tab]").forEach(function(btn){
      btn.onclick = function(){
        state.adminTab = btn.getAttribute("data-tab");
        state.qrOpenFor = null;
        // Cada aba começa na primeira página da sua lista.
        state.adminPage = 1; state.overviewPage = 1;
        // No celular a gaveta cobre a tela, então volta pro trilho ao escolher uma aba.
        if(isMobileLayout()) state.sidebarOpen = false;
        render();
      };
    });
    if($("a-logout")) $("a-logout").onclick = logout;
    if($("a-brand-toggle")) $("a-brand-toggle").onclick = toggleSidebar;
    if($("a-sidebar-backdrop")) $("a-sidebar-backdrop").onclick = toggleSidebar;

    // aba Registros - qualquer mudança de filtro volta pra primeira página, senão a pessoa
    // poderia ficar numa página que não existe mais na lista nova.
    document.querySelectorAll("[data-filter]").forEach(function(btn){
      btn.onclick = function(){ state.adminFilter = btn.getAttribute("data-filter"); state.adminPage = 1; render(); };
    });
    if($("a-vehicle")) $("a-vehicle").onchange = function(ev){ state.adminVehicle = ev.target.value; state.adminPage = 1; render(); };
    // A busca só filtra de verdade ao clicar em "Buscar" ou apertar Enter - só guarda o que
    // foi digitado enquanto isso, sem re-renderizar a cada letra.
    if($("a-search")) $("a-search").oninput = function(ev){ state.adminSearch = ev.target.value; };
    if($("a-search")) $("a-search").onkeydown = function(ev){ if(ev.key === "Enter"){ ev.preventDefault(); state.adminPage = 1; render(); } };
    if($("a-search-btn")) $("a-search-btn").onclick = function(){ state.adminPage = 1; render(); };
    if($("a-sort")) $("a-sort").onchange = function(ev){ state.adminSort = ev.target.value; state.adminPage = 1; render(); };
    if($("a-export")) $("a-export").onclick = generatePDF;

    // Rodapé de páginas (Registros e Dashboard) + botão de voltar ao topo.
    document.querySelectorAll("[data-page-cl]").forEach(function(btn){
      btn.onclick = function(){ state.adminPage = Number(btn.getAttribute("data-page-cl")); render(); scrollAdminToTop(); };
    });
    document.querySelectorAll("[data-page-ov]").forEach(function(btn){
      btn.onclick = function(){ state.overviewPage = Number(btn.getAttribute("data-page-ov")); render(); scrollAdminToTop(); };
    });
    document.querySelectorAll("[data-scroll-top]").forEach(function(btn){
      btn.onclick = scrollAdminToTop;
    });
    // Botão de atualizar: existe em todas as abas do painel.
    document.querySelectorAll(".btn-refresh").forEach(function(btn){
      btn.onclick = refreshAdminData;
    });
    document.querySelectorAll("[data-photo]").forEach(function(img){
      img.onclick = function(){ state.modalPhoto = img.getAttribute("src"); render(); };
    });
    if($("photo-modal-bg")) $("photo-modal-bg").onclick = function(){ state.modalPhoto = null; render(); };

    // aba Veículos
    if($("v-plate")) $("v-plate").oninput = function(ev){
      state.newVehicle.plate = ev.target.value.toUpperCase();
      ev.target.value = state.newVehicle.plate;
    };
    if($("v-marca")) $("v-marca").oninput = function(ev){
      state.newVehicle.marca = ev.target.value.toUpperCase();
      ev.target.value = state.newVehicle.marca;
    };
    if($("v-model")) $("v-model").oninput = function(ev){
      state.newVehicle.model = ev.target.value.toUpperCase();
      ev.target.value = state.newVehicle.model;
    };
    if($("v-renavam")) $("v-renavam").oninput = function(ev){
      state.newVehicle.renavam = ev.target.value.replace(/\D/g,"").slice(0,11);
      ev.target.value = state.newVehicle.renavam;
    };
    if($("v-chassi")) $("v-chassi").oninput = function(ev){
      // Chassi (VIN) é sempre em maiúsculo, 17 caracteres entre letras e números.
      state.newVehicle.chassi = ev.target.value.toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,17);
      ev.target.value = state.newVehicle.chassi;
    };
    if($("v-anomodelo")) $("v-anomodelo").oninput = function(ev){
      state.newVehicle.anoModelo = ev.target.value.replace(/\D/g,"").slice(0,4);
      ev.target.value = state.newVehicle.anoModelo;
    };
    if($("v-anofab")) $("v-anofab").oninput = function(ev){
      state.newVehicle.anoFabricacao = ev.target.value.replace(/\D/g,"").slice(0,4);
      ev.target.value = state.newVehicle.anoFabricacao;
    };
    if($("v-vinculo")) $("v-vinculo").onchange = function(ev){ state.newVehicle.vinculo = ev.target.value; };
    if($("v-add")) $("v-add").onclick = addVehicle;
    if($("v-cancel")) $("v-cancel").onclick = cancelEditVehicle;
    document.querySelectorAll("[data-del]").forEach(function(btn){
      btn.onclick = function(){ removeVehicle(btn.getAttribute("data-del")); };
    });
    document.querySelectorAll("[data-edit-vehicle]").forEach(function(btn){
      btn.onclick = function(){ startEditVehicle(btn.getAttribute("data-edit-vehicle")); };
    });
    document.querySelectorAll("[data-qr]").forEach(function(btn){
      btn.onclick = function(){
        var id = btn.getAttribute("data-qr");
        state.qrOpenFor = (state.qrOpenFor === id) ? null : id;
        render();
      };
    });

    // aba Motoristas
    if($("d-name")) $("d-name").oninput = function(ev){ state.newDriver.name = ev.target.value; };
    if($("d-matricula")) $("d-matricula").oninput = function(ev){
      state.newDriver.matricula = ev.target.value.replace(/\D/g,"").slice(0,15);
      ev.target.value = state.newDriver.matricula;
    };
    if($("d-cnh")) $("d-cnh").oninput = function(ev){ state.newDriver.cnh = ev.target.value; };
    if($("d-phone")) $("d-phone").oninput = function(ev){ state.newDriver.phone = ev.target.value; };
    if($("d-status")) $("d-status").onchange = function(ev){ state.newDriver.status = ev.target.value; };
    if($("d-cpf")) $("d-cpf").oninput = function(ev){
      state.newDriver.cpf = ev.target.value.replace(/\D/g,"").slice(0,11);
      ev.target.value = state.newDriver.cpf;
    };
    if($("d-birthdate")) $("d-birthdate").onchange = function(ev){ state.newDriver.birthDate = ev.target.value; };
    if($("d-cnhregistro")) $("d-cnhregistro").oninput = function(ev){
      state.newDriver.cnhRegistro = ev.target.value.replace(/\D/g,"").slice(0,11);
      ev.target.value = state.newDriver.cnhRegistro;
    };
    if($("d-cnhemissao")) $("d-cnhemissao").onchange = function(ev){ state.newDriver.cnhEmissao = ev.target.value; };
    if($("d-cnhvalidade")) $("d-cnhvalidade").onchange = function(ev){ state.newDriver.cnhValidade = ev.target.value; };
    if($("d-add")) $("d-add").onclick = addDriver;
    if($("d-cancel")) $("d-cancel").onclick = cancelEditDriver;
    document.querySelectorAll("[data-del-driver]").forEach(function(btn){
      btn.onclick = function(){ removeDriver(btn.getAttribute("data-del-driver")); };
    });
    document.querySelectorAll("[data-edit-driver]").forEach(function(btn){
      btn.onclick = function(){ startEditDriver(btn.getAttribute("data-edit-driver")); };
    });

    // aba Usuários
    if($("u-name")) $("u-name").oninput = function(ev){ state.newUser.name = ev.target.value; };
    if($("u-username")) $("u-username").oninput = function(ev){ state.newUser.username = ev.target.value; };
    if($("u-cpf")) $("u-cpf").oninput = function(ev){ state.newUser.cpf = ev.target.value; };
    if($("u-email")) $("u-email").oninput = function(ev){ state.newUser.email = ev.target.value; };
    if($("u-phone")) $("u-phone").oninput = function(ev){ state.newUser.phone = ev.target.value; };
    if($("u-password")) $("u-password").oninput = function(ev){ state.newUser.password = ev.target.value; };
    if($("u-add")) $("u-add").onclick = addUser;
    if($("u-cancel")) $("u-cancel").onclick = cancelEditUser;
    document.querySelectorAll("[data-del-user]").forEach(function(btn){
      btn.onclick = function(){ requestRemoveUser(btn.getAttribute("data-del-user")); };
    });
    document.querySelectorAll("[data-edit-user]").forEach(function(btn){
      btn.onclick = function(){ startEditUser(btn.getAttribute("data-edit-user")); };
    });
    document.querySelectorAll("[data-pw-user]").forEach(function(btn){
      btn.onclick = function(){ openPasswordModal(btn.getAttribute("data-pw-user")); };
    });
    if($("pw-old")) $("pw-old").oninput = function(ev){ state.pwOldValue = ev.target.value; };
    if($("pw-new")) $("pw-new").oninput = function(ev){ state.pwValue = ev.target.value; };
    if($("pw-new2")) $("pw-new2").oninput = function(ev){ state.pwValue2 = ev.target.value; };
    if($("pw-eye")) $("pw-eye").onclick = function(){ state.pwShow = !state.pwShow; render(); };
    if($("pw-cancel")) $("pw-cancel").onclick = closePasswordModal;
    if($("pw-save")) $("pw-save").onclick = submitPasswordModal;

    // modal de troca de senha obrigatória (primeiro login)
    if($("fp-new")){
      $("fp-new").focus();
      $("fp-new").oninput = function(ev){ state.forcePwValue = ev.target.value; };
    }
    if($("fp-new2")){
      $("fp-new2").oninput = function(ev){ state.forcePwValue2 = ev.target.value; };
      $("fp-new2").onkeydown = function(ev){ if(ev.key === "Enter") submitForcePassword(); };
    }
    if($("fp-eye")) $("fp-eye").onclick = function(){ state.forcePwShow = !state.forcePwShow; render(); };
    if($("fp-save")) $("fp-save").onclick = submitForcePassword;
    if($("fp-logout")) $("fp-logout").onclick = logout;

    // aba Gerenciar checklists - igual à aba Checklists, a busca só filtra ao confirmar.
    if($("mg-search")){
      $("mg-search").oninput = function(ev){ state.manageSearch = ev.target.value; };
      $("mg-search").onkeydown = function(ev){ if(ev.key === "Enter"){ ev.preventDefault(); render(); } };
    }
    if($("mg-search-btn")) $("mg-search-btn").onclick = function(){ render(); };
    document.querySelectorAll("[data-manage-edit]").forEach(function(btn){
      btn.onclick = function(){ startManageEdit(btn.getAttribute("data-manage-edit")); };
    });
    document.querySelectorAll("[data-manage-del]").forEach(function(btn){
      btn.onclick = function(){ requestDeleteManagedEntry(btn.getAttribute("data-manage-del")); };
    });
    if($("me-vehicle")) $("me-vehicle").onchange = function(ev){ state.editEntryForm.vehicleId = ev.target.value; };
    if($("me-matricula")) $("me-matricula").oninput = function(ev){
      state.editEntryForm.matricula = ev.target.value.replace(/\D/g,"").slice(0,15);
      ev.target.value = state.editEntryForm.matricula;
    };
    if($("me-condutor")) $("me-condutor").oninput = function(ev){ state.editEntryForm.condutor = ev.target.value; };
    if($("me-date")) $("me-date").onchange = function(ev){ state.editEntryForm.date = ev.target.value; };
    if($("me-percurso")) $("me-percurso").oninput = function(ev){ state.editEntryForm.percurso = ev.target.value; };
    if($("me-horasaida")) $("me-horasaida").onchange = function(ev){ state.editEntryForm.horaSaida = ev.target.value; };
    if($("me-horachegada")) $("me-horachegada").onchange = function(ev){ state.editEntryForm.horaChegada = ev.target.value; };
    if($("me-kmout")) $("me-kmout").oninput = function(ev){ state.editEntryForm.kmOut = ev.target.value; };
    if($("me-kmin")) $("me-kmin").oninput = function(ev){ state.editEntryForm.kmIn = ev.target.value; };
    document.querySelectorAll("[data-mequip]").forEach(function(group){
      var key = group.getAttribute("data-mequip");
      group.querySelectorAll("button").forEach(function(btn){
        btn.onclick = function(){ state.editEntryForm[key] = btn.getAttribute("data-val"); render(); };
      });
    });
    if($("me-save")) $("me-save").onclick = requestSaveManagedEntry;
    if($("me-cancel")) $("me-cancel").onclick = cancelManageEdit;

    // modal de confirmação de senha (edição/exclusão de checklist)
    if($("cf-password")){
      $("cf-password").focus();
      $("cf-password").oninput = function(ev){ state.confirmPassword = ev.target.value; };
      $("cf-password").onkeydown = function(ev){ if(ev.key === "Enter") submitConfirmAction(); };
    }
    if($("cf-cancel")) $("cf-cancel").onclick = cancelConfirmAction;
    if($("cf-ok")) $("cf-ok").onclick = submitConfirmAction;
  }

  // Ponto de entrada: dispara tudo assim que o script carrega.
  init();
})();
</script>
</body>
</html>
