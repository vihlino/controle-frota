# Configuracao do projeto SITRA no Render.
#
# O projeto possui:
#
# - Um banco PostgreSQL: sitra-db
# - Uma API Node.js: sitra-api
#
# A API e construida usando a pasta "app" como contexto Docker.
# Isso permite que o Docker tenha acesso tanto a:
#
# app/api/ -> codigo da API
# app/db/  -> arquivos SQL do banco

services:

  # --------------------------------------------------------------------------
  # API DO SITRA
  # --------------------------------------------------------------------------

  - type: web
    name: sitra-api

    # A API utiliza Docker para o deploy.
    runtime: docker

    # Repositorio conectado ao Render.
    repo: https://github.com/vihlino/controle-frota

    # Branch utilizada para o deploy.
    branch: feature/login-como-tela-inicial

    # Plano atual do servico.
    plan: free

    # Regiao onde a API esta hospedada.
    region: oregon

    # ------------------------------------------------------------------------
    # DOCKER
    # ------------------------------------------------------------------------

    # O contexto agora e a pasta "app".
    #
    # Dessa forma, durante o build, o Docker consegue acessar:
    #
    # app/api/
    # app/db/
    dockerContext: app

    # ATENCAO: o dockerfilePath NAO e relativo ao dockerContext - e relativo a
    # RAIZ DO REPOSITORIO, igual ao dockerContext. Sao dois caminhos
    # independentes, ambos contados da raiz.
    #
    # Com "api/Dockerfile" o Render procurava <raiz>/api/Dockerfile, que nao
    # existe, e o build morria antes de comecar:
    #
    #   error: invalid local: resolve : lstat
    #   /opt/render/project/src/api: no such file or directory
    #
    # O deploy falhava, o Render mantinha a versao anterior no ar, e o sistema
    # parecia "nao ter recebido as correcoes".
    dockerfilePath: app/api/Dockerfile

    # ------------------------------------------------------------------------
    # HEALTH CHECK
    # ------------------------------------------------------------------------

    # O Render verifica esta rota para confirmar que a API esta funcionando.
    healthCheckPath: /api/saude

    # ------------------------------------------------------------------------
    # DEPLOY
    # ------------------------------------------------------------------------

    # Um novo commit na branch configurada gera um novo deploy.
    autoDeployTrigger: commit

    # ------------------------------------------------------------------------
    # VARIAVEIS DE AMBIENTE
    # ------------------------------------------------------------------------

    envVars:

      # ----------------------------------------------------------------------
      # FUSO HORARIO
      # ----------------------------------------------------------------------
      # O container do Render nasce em UTC, tres horas a frente do Brasil.
      # Sem isto, um checklist enviado as 22h seria gravado como 1h do dia
      # SEGUINTE - o relatorio diario perderia o registro.
      #
      # O valor tambem esta fixo no Dockerfile; aqui ele fica visivel no painel
      # do Render e pode ser trocado sem refazer a imagem.
      - key: TZ
        value: America/Sao_Paulo

      # Login inicial utilizado pelo seed do sistema.
      - key: SEED_LOGIN
        sync: false

      # Senha do administrador criado pelo seed. Faltava aqui, e o codigo
      # tinha uma senha padrao escrita nele - num repositorio publico. Agora o
      # seed se recusa a rodar sem esta variavel, entao ela precisa existir.
      - key: SEED_SENHA
        sync: false

      # Tempo de expiracao do token JWT.
      - key: JWT_EXPIRES_IN
        sync: false

      # Chave utilizada para assinar os tokens JWT.
      - key: JWT_SECRET
        sync: false

      # ----------------------------------------------------------------------
      # CONEXAO COM O POSTGRESQL
      # ----------------------------------------------------------------------

      - key: PGHOST
        sync: false

      - key: PGPORT
        sync: false

      - key: PGDATABASE
        sync: false

      - key: PGUSER
        sync: false

      - key: PGPASSWORD
        sync: false