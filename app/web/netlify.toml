# netlify.toml - Configuracao do Netlify para o front React do SITRA
#
# Como usar:
#   1. Acesse netlify.com, crie uma conta gratis
#   2. Add new site > Import from Git > escolha o repositorio
#   3. Configure a variavel de ambiente VITE_API_URL com a URL da API no Render
#      (ex.: https://sitra-api.onrender.com)
#   4. O Netlify faz o build e publica automaticamente

[build]
  base    = "app/web"
  command = "npm run build"
  publish = "dist"

# Redireciona todas as rotas para o index.html.
# Sem isso, acessar /frotas/veiculos diretamente daria 404, porque o arquivo
# fisico nao existe - o React Router que gerencia essas rotas.
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
