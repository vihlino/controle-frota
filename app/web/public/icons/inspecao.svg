<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Círculo externo da lente -->
  <circle
    cx="300"
    cy="212"
    r="160"
    fill="none"
    stroke="#000000"
    stroke-width="30"
  />

  <!-- Círculo interno -->
  <circle
    cx="300"
    cy="212"
    r="125"
    fill="none"
    stroke="#000000"
    stroke-width="14"
  />

  <!-- Cabo da lupa -->
  <g transform="rotate(45, 187, 325)">
    <!-- Haste principal -->
    <rect
      x="172"
      y="325"
      width="30"
      height="140"
      fill="#ffffff"
      stroke="#000000"
      stroke-width="30"
      stroke-linejoin="miter"
    />
    <!-- Divisória da ponta do cabo -->
    <line
      x1="157"
      y1="410"
      x2="217"
      y2="410"
      stroke="#000000"
      stroke-width="30"
      stroke-linecap="square"
    />
  </g>

  <!-- Símbolo de confirmação (Checkmark) -->
  <path
    d="M 240 215 L 285 260 L 370 160"
    fill="none"
    stroke="#000000"
    stroke-width="32"
    stroke-linecap="square"
    stroke-linejoin="miter"
  />
</svg>
